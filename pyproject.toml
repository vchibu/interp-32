[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-accent-wav2vec2-analysis"
version = "0.1.0"
description = "Preparation and analysis pipeline for Speech Accent Archive with wav2vec2 hidden states."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "soundfile>=0.12",
  "librosa>=0.10",
  "torch>=2.2",
  "torchaudio>=2.2",
  "transformers>=4.57",
  "scikit-learn>=1.5",
  "umap-learn>=0.5",
  "matplotlib>=3.8",
  "tqdm>=4.66",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
